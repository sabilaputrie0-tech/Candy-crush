<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff7eb3, #ff758c, #7afcff);
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #board {
            width: 450px;
            height: 450px;
            background-color: lightblue;
            border: 5px solid slategray;
            border-radius: 10px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .tile {
            width: 50px;
            height: 50px;
            font-size: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }

        .selected {
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Score: <span id="score">0</span></h1>
    <div id="board"></div>

    <script>
        const candies = ["🍬", "🍭", "🍩", "🍪", "🍫", "🧁"];
        const board = [];
        const rows = 9;
        const columns = 9;
        let score = 0;

        let currTile = null;
        let otherTile = null;

        window.onload = function() {
            startGame();

            window.setInterval(function() {
                crushCandy();
                slideCandy();
                generateCandy();
            }, 100);
        }

        function randomCandy() {
            return candies[Math.floor(Math.random() * candies.length)];
        }

        function startGame() {
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < columns; c++) {
                    let tile = document.createElement("div");
                    tile.id = r.toString() + "-" + c.toString();
                    tile.className = "tile";
                    tile.innerText = randomCandy();

                    tile.addEventListener("click", handleTileClick);

                    document.getElementById("board").append(tile);
                    row.push(tile);
                }
                board.push(row);
            }
        }

        function handleTileClick() {
            if (this.innerText === "") return;

            if (!currTile) {
                currTile = this;
                currTile.classList.add("selected");
            } else {
                otherTile = this;
                currTile.classList.remove("selected");
                swapTiles();
                currTile = null;
                otherTile = null;
            }
        }

        function swapTiles() {
            if (currTile === otherTile) return;

            let currCoords = currTile.id.split("-");
            let r = parseInt(currCoords[0]);
            let c = parseInt(currCoords[1]);

            let otherCoords = otherTile.id.split("-");
            let r2 = parseInt(otherCoords[0]);
            let c2 = parseInt(otherCoords[1]);

            let moveLeft = c2 == c - 1 && r == r2;
            let moveRight = c2 == c + 1 && r == r2;
            let moveUp = r2 == r - 1 && c == c2;
            let moveDown = r2 == r + 1 && c == c2;

            let isAdjacent = moveLeft || moveRight || moveUp || moveDown;

            if (isAdjacent) {
                let currCandy = currTile.innerText;
                let otherCandy = otherTile.innerText;
                currTile.innerText = otherCandy;
                otherTile.innerText = currCandy;

                let validMove = checkValid();
                if (!validMove) {
                    currTile.innerText = currCandy;
                    otherTile.innerText = otherCandy;
                }
            }
        }

        function crushCandy() {
            crushThree();
            document.getElementById("score").innerText = score;
        }

        function crushThree() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns - 2; c++) {
                    let candy1 = board[r][c];
                    let candy2 = board[r][c + 1];
                    let candy3 = board[r][c + 2];
                    if (candy1.innerText === candy2.innerText && candy2.innerText === candy3.innerText && candy1.innerText !== "") {
                        candy1.innerText = "";
                        candy2.innerText = "";
                        candy3.innerText = "";
                        score += 30;
                    }
                }
            }

            for (let c = 0; c < columns; c++) {
                for (let r = 0; r < rows - 2; r++) {
                    let candy1 = board[r][c];
                    let candy2 = board[r + 1][c];
                    let candy3 = board[r + 2][c];
                    if (candy1.innerText === candy2.innerText && candy2.innerText === candy3.innerText && candy1.innerText !== "") {
                        candy1.innerText = "";
                        candy2.innerText = "";
                        candy3.innerText = "";
                        score += 30;
                    }
                }
            }
        }

        function checkValid() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns - 2; c++) {
                    let candy1 = board[r][c];
                    let candy2 = board[r][c + 1];
                    let candy3 = board[r][c + 2];
                    if (candy1.innerText === candy2.innerText && candy2.innerText === candy3.innerText && candy1.innerText !== "") {
                        return true;
                    }
                }
            }

            for (let c = 0; c < columns; c++) {
                for (let r = 0; r < rows - 2; r++) {
                    let candy1 = board[r][c];
                    let candy2 = board[r + 1][c];
                    let candy3 = board[r + 2][c];
                    if (candy1.innerText === candy2.innerText && candy2.innerText === candy3.innerText && candy1.innerText !== "") {
                        return true;
                    }
                }
            }

            return false;
        }

        function slideCandy() {
            for (let c = 0; c < columns; c++) {
                let ind = rows - 1;
                for (let r = columns - 1; r >= 0; r--) {
                    if (board[r][c].innerText !== "") {
                        board[ind][c].innerText = board[r][c].innerText;
                        ind -= 1;
                    }
                }

                for (let r = ind; r >= 0; r--) {
                    board[r][c].innerText = "";
                }
            }
        }

        function generateCandy() {
            for (let c = 0; c < columns; c++) {
                if (board[0][c].innerText === "") {
                    board[0][c].innerText = randomCandy();
                }
            }
        }
    </script>
</body>
</html>
